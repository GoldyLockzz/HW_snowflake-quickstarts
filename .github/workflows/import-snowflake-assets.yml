name: Import Snowflake Cortex Assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination repo
        uses: actions/checkout@v4

      - name: Clone Snowflake quickstarts
        run: |
          git clone --depth 1 https://github.com/Snowflake-Labs/sfquickstarts.git source-repo

      - name: Copy Cortex Code assets
        run: |
          mkdir -p assets
          cp -r source-repo/site/sfguides/src/accelerate-app-dev-cortex-code/assets/. assets/

      - name: Commit imported assets
        run: |
          rm -rf source-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Import Cortex Code assets from Snowflake Labs" || echo "No changes to commit"
          git push
