name: Import Snowflake Quickstarts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-quickstarts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination repo
        uses: actions/checkout@v4

      - name: Clone only selected Snowflake quickstarts
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Snowflake-Labs/sfquickstarts.git source-repo
          cd source-repo
          git sparse-checkout init --cone
          git sparse-checkout set \
            site/sfguides/src/accelerate-app-dev-cortex-code \
            site/sfguides/src/from-zero-to-agents
          git checkout master

      - name: Copy selected quickstarts
        run: |
          QUICKSTARTS=(
            "accelerate-app-dev-cortex-code"
            "from-zero-to-agents"
          )

          SOURCE_ROOT="source-repo/site/sfguides/src"

          for qs in "${QUICKSTARTS[@]}"; do
            echo "Importing $qs..."

            mkdir -p "$qs"

            # Copy assets folder if it exists
            if [ -d "$SOURCE_ROOT/$qs/assets" ]; then
              rm -rf "$qs/assets"
              cp -r "$SOURCE_ROOT/$qs/assets" "$qs/assets"
            fi

            # Copy the matching markdown guide
            if [ -f "$SOURCE_ROOT/$qs/$qs.md" ]; then
              cp "$SOURCE_ROOT/$qs/$qs.md" "$qs/$qs.md"
            fi
          done

      - name: Commit imported quickstarts
        run: |
          rm -rf source-repo

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Sync Snowflake quickstarts" || echo "No changes to commit"
          git push
