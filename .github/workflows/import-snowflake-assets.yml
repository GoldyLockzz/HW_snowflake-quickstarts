
name: Import Snowflake Quickstarts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-quickstarts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my GitHub repository
        uses: actions/checkout@v4

      - name: Import selected Snowflake projects
        shell: bash
        run: |
          set -euo pipefail

          # ==========================================
          # EDIT ONLY THIS SECTION
          # Add/remove Snowflake project folder names
          # ==========================================

          QUICKSTARTS=(
            "accelerate-app-dev-cortex-code"
            "from-zero-to-agents"
            "compare-and-evaluate-chunking-strategies"
          )

          # ==========================================
          # NO NEED TO EDIT BELOW
          # ==========================================

          git clone --depth 1 --filter=blob:none \
            --sparse --branch master \
            https://github.com/Snowflake-Labs/sfquickstarts.git \
            /tmp/sfquickstarts

          cd /tmp/sfquickstarts

          PATHS=()
          for qs in "${QUICKSTARTS[@]}"; do
            PATHS+=("site/sfguides/src/$qs")
          done

          git sparse-checkout set "${PATHS[@]}"

          cd "$GITHUB_WORKSPACE"

          SOURCE_ROOT="/tmp/sfquickstarts/site/sfguides/src"

          for qs in "${QUICKSTARTS[@]}"; do
            echo "Importing: $qs"

            if [ ! -d "$SOURCE_ROOT/$qs" ]; then
              echo "::error::Project not found: $qs"
              exit 1
            fi
          done

          for qs in "${QUICKSTARTS[@]}"; do
            rm -rf -- "$qs"
            cp -a -- "$SOURCE_ROOT/$qs" "$qs"
            echo "Imported: $qs"
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Already up to date"
          else
            git commit -m "Sync selected Snowflake quickstarts"
            git push
          fi
